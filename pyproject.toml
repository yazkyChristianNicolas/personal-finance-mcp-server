[project]
name = "personal-finance-mcp-server"
version = "0.1.0"
description = "MCP server remoto para personal-finance-service, autenticado con Keycloak (OAuth 2.0 + PKCE para usuarios humanos, Client Credentials para un agente headless)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "starlette>=0.38.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
